[project]
name = "orchestrated-loop-demo"
version = "0.1.0"
description = "Dummy orchestrated agent loop demo"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
orchestrated-loop = "orchestrated_loop.loop:main"
orchestrated-gate = "orchestrated_loop.gate_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
